# The no-bloat checks (Knip, jscpd, gzip weight per route) on every pull request. WARN-ONLY: they report to the run's
# summary and never turn a pull request red. A number above its baseline is a ::warning::, not a failure.
# Knip and jscpd are devkit's shared workflow with warn-only (devkit-no-bloat --warn-only against .no-bloat.json, both
# run through npx at the specs it names; neither is a dependency of the app). Route weight stays a job here.
# See no-bloat/README.md.

name: No bloat

on:
  pull_request:

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-bloat:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@a0fbcb5c7f65e4183a97989511f9d352950ad90b # v0.20.7
    with:
      warn-only: true

  route-weight:
    name: Route weight (warn only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing in this job may turn a pull request red, including the install.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Route weight
        continue-on-error: true
        run: |
          # A tool that could not run is a warning on the run, not a silent pass: continue-on-error alone hides it.
          # devkit-route-weight writes its table to the summary and warns against the baseline in .route-weight.json.
          if ! (npm run build && npx devkit-route-weight); then
            echo "::warning::the route weight report could not run; see this step's log"
            exit 1
          fi
