# The no-bloat checks (Knip, jscpd, gzip weight per route) on every pull request. WARN-ONLY: they report to the run's
# summary and never turn a pull request red. A number above its baseline is a ::warning::, not a failure.
# Knip and jscpd are devkit's shared workflow with warn-only (devkit-no-bloat --warn-only against .no-bloat.json, both
# run through npx at the specs it names; neither is a dependency of the app). Route weight stays a job here.
# See no-bloat/README.md.

name: No bloat

on:
  pull_request:

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-bloat:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@65782d2c45431055672a315f0d126b62d0dd3aff # v0.20.14
    with:
      warn-only: true

  route-weight:
    name: Route weight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A gate (area 7, D5): a route over .route-weight.json's budget_bytes, or grown past its baseline, fails the job.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Route weight
        # devkit-route-weight writes its table to the summary and fails against .route-weight.json (enforce: true).
        run: npm run build && npx devkit-route-weight
