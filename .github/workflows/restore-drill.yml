name: restore-drill

# The weekly restore drill of the nightly D1 dump (app/lib/backup.server.ts), devkit's shared restore-drill.yml pinned
# by full sha: d1-dump downloads the newest complete run from txasm-books (backups/json/), restores it into a scratch
# SQLite file and checks it. The token needs R2 read on that bucket only.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@1f148951b94eb9c495dc94c1f7d5bb79fd5db7b1 # v0.61.0
    with:
      bucket: txasm-books
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
