# Typecheck, lint, tests and build on every pull request and on main, then a deploy from main. One job and an
# npm cache keep the Actions minutes low; the steps run in order and the first red one stops the run. A run on
# main is never canceled, so a deploy cannot stop halfway.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # A merge to main deploys once CI is green: migrations first, then the Worker. Dormant until the repo
  # variable CF_DEPLOY is 'true', so CI stays green before the Cloudflare token is added.
  # devkit's shared deploy (worker-deploy.yml): it applies the D1 migrations and builds, deploys with DEPLOY_SHA set to
  # this commit, waits for /health to report it, checks the home page answers, and rolls the deploy back if it does not.
  # A rollback never undoes a migration. The address is workers.dev until txasm.org moves to Cloudflare.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@f55d2caadaa7a18a73397fb8defffb2e3123967b # v0.20.3
    with:
      worker-name: txasm
      health-url: https://txasm.dustin-edwards.workers.dev/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://txasm.dustin-edwards.workers.dev/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      pre-deploy: npm run db:migrate:prod && npm run build
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
