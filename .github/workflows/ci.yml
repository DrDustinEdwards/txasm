# Typecheck, lint, tests and build on every pull request and on main, then a deploy from main. One job and an
# npm cache keep the Actions minutes low; the steps run in order and the first red one stops the run. A run on
# main is never canceled, so a deploy cannot stop halfway.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Raw console.* calls in server code may not rise above .console.json's baseline (devkit-console; the logger is
      # site-runtime ./log; public/ holds vendored browser scripts), and a migration in drizzle/ is never edited,
      # renamed or deleted, and a new one only adds unless it says `-- contract: <reason>` (devkit-migrations,
      # drizzle/manifest.json).
      - name: Console ratchet
        run: npm run --silent check:console

      - name: Migrations are expand-only
        run: npm run --silent check:migrations

      - name: Build
        run: npm run build

  # A merge to main deploys once CI is green: migrations first, then the Worker. Dormant until the repo
  # variable CF_DEPLOY is 'true', so CI stays green before the Cloudflare token is added.
  # devkit's shared deploy (worker-deploy.yml): devkit-migrations --apply applies the pending migrations that only add
  # (a drop, rename or row delete waits for a hand run), then it builds, deploys with DEPLOY_SHA set to
  # this commit, waits for /health to report it, checks the home page answers, and rolls the deploy back if it does not.
  # A rollback never undoes a migration: with d1-database, the D1 Time Travel bookmark from before the migrations and
  # its restore command go to the run's summary. The address is workers.dev until txasm.org moves to Cloudflare.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@db347b70932b52b427b120ee1419d4614d5e4c29 # v0.20.20
    with:
      worker-name: txasm
      health-url: https://txasm.dustin-edwards.workers.dev/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://txasm.dustin-edwards.workers.dev/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      pre-deploy: npx devkit-migrations drizzle --apply txasm && npm run build
      sha-var: DEPLOY_SHA
      d1-database: txasm
      # Gradual rollout (D4): the new version takes 10% of traffic for 10 minutes before the live gate judges it and it
      # takes all traffic; a refused one is rolled back to the version it shared traffic with. Durable Object migrations
      # (wrangler.jsonc) cannot go out this way: a deploy that adds one sets gradual-percent to 0 for that deploy.
      gradual-percent: 10
      gradual-minutes: 10
      # No preview per pull request (D6): Cloudflare makes no preview URL for a Worker that has a Durable Object, and
      # txasm has one (RateLimiter, the sign-in limits). Stated, so it is not mistaken for forgotten.
      preview: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
