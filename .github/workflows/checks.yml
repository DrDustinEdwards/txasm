name: checks

# Every pull request check in one job (devkit's pr.yml, README "One job per pull request"): the "Generated by Claude Code"
# footer removed from pull request descriptions, no AI trailer or author on new commits, the shared-code check, OSV-Scanner
# in pull request mode, actionlint and zizmor when the change touches .github/, the no-bloat ratchet (.no-bloat.json), the
# Worker bundle size (.worker-size.json) and the advisory reviewer. Exceptions to the shared-code check are in .shared.json
# with their reasons. What is shared: https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
# No push to main: the merge was checked as a pull request (devkit README, "No second run on main"). Run it by hand once
# to clean the footer from every past pull request.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  # Once a day on the default branch: the shared-code check judges the repository's state there, which a pull request's
  # run leaves to it (devkit pr.yml, "THE CALLER"). A red run is Capsid's job for this repository.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is `checks`, so the check is "checks / Repo checks", the name the ruleset requires.
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@90efbee8e78a1b07b334d5058d19cb0e2a9828d0 # v0.48.0
    with:
      review: true
      worker-size-prepare: npm run build
