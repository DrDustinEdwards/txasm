name: access-drift

# The daily Access drift check (I2), devkit's reusable workflow: it reads the txasm-login Access application's policies
# and compares who they let in with the site's platform admins, which it reads from the site itself (/admin/access-drift,
# hashed, to an Access service token only; app/routes/admin.access-drift.ts), so no copy of ADMIN_EMAILS is kept here.
# Chairs and reviewers are not Access users and are not compared. It fails until all four secrets are set, by design.
# The host moves to txasm.org at cutover.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: DrDustinEdwards/devkit/.github/workflows/access-drift.yml@005509b56d9830b785f17ba496f4a3c223fc392c # v0.20.19
    with:
      app: txasm-login
      admins-url: https://txasm.dustin-edwards.workers.dev/admin/access-drift
      site-runtime-ref: v0.59.0
    secrets:
      ACCESS_READ_TOKEN: ${{ secrets.ACCESS_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
      ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
