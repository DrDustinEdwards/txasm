name: scorecard

# OpenSSF Scorecard (area 12, C5): devkit's scorecard.yml publishes the score, uploads it to code scanning and fails when it
# falls below the last published one. Scorecard publishes only from the default branch, on a push or the schedule. This file
# keeps no top-level env, defaults or write permissions, which the Scorecard API would refuse.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: DrDustinEdwards/devkit/.github/workflows/scorecard.yml@dc0b4ddf288604a411187c35a6d1638f0f0af7df # v0.25.0
