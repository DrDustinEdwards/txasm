# The gzip weight of each route's JS and CSS against .route-weight.json, on every pull request (area 7, D5). Knip and
# jscpd, which ran beside it here, are in checks.yml now (devkit's pr.yml). See no-bloat/README.md.

name: Route weight

on:
  pull_request:

concurrency:
  group: route-weight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route-weight:
    name: Route weight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A gate (area 7, D5): a route over .route-weight.json's budget_bytes, or grown past its baseline, fails the job.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Route weight
        # devkit-route-weight writes its table to the summary and fails against .route-weight.json (enforce: true).
        run: npm run build && npx devkit-route-weight
