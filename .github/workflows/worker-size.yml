name: worker-size

# The Worker bundle size budget in .worker-size.json, checked by devkit's shared worker-size.yml against
# `wrangler deploy --dry-run` of the build. No secret: a dry run never talks to the account.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@71f342e07f91d3be216f2dfd8e9815a0f9f7299c # v0.20.13
    with:
      prepare: npm run build
