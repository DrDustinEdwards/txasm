# OSV-Scanner exceptions (devkit dependencies.yml). Each has a reason and a date it expires, so it is looked at again.

[[IgnoredVulns]]
id = "GHSA-5pm8-86m8-9m6r"
ignoreUntil = 2026-12-17
reason = "basic-ftp 5.3.1 comes from @cloudflare/puppeteer 1.4.0 -> @puppeteer/browsers -> proxy-agent -> get-uri 6, which pins ^5. The Worker never fetches an ftp: URL or downloads a browser. The fix is @cloudflare/puppeteer 2.x, which drops @puppeteer/browsers; a major bump to the book PDF path that needs Browser Rendering to verify."

